replicaCount: 1
image:
  repository: ghcr.io/pierinho13/external-service-discovery-operator
  pullPolicy: IfNotPresent
  tag: ""
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  annotations: {}
  name: ""
rbac:
  create: true
leaderElection:
  enabled: true
discovery:
  refreshInterval: 1m
log:
  level: INFO
podAnnotations: {}
podLabels: {}
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  capabilities:
    drop: [ALL]
resources:
  limits: {cpu: 500m, memory: 128Mi}
  requests: {cpu: 10m, memory: 64Mi}
livenessProbe: {initialDelaySeconds: 15, periodSeconds: 20}
readinessProbe: {initialDelaySeconds: 5, periodSeconds: 10}
extraArgs: []
nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 10
revisionHistoryLimit: 3
