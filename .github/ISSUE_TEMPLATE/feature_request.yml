name: Feature request
description: Suggest an improvement for external-service-discovery-operator
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        `external-service-discovery-operator` projects external workloads into native Kubernetes Service and EndpointSlice resources without providing a data plane.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like.
    validations:
      required: true

  - type: textarea
    id: example
    attributes:
      label: Example usage or output
      description: Show an example when useful.
      render: shell

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any alternatives or workarounds.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This feature remains focused on Kubernetes external service discovery.
          required: true
        - label: This request does not require exposing sensitive data.
          required: true
