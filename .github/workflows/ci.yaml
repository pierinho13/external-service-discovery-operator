name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generated-files:
    name: Update generated files
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    outputs:
      changed: ${{ steps.generated.outputs.changed }}

    steps:
      - name: Checkout writable pull request branch
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GENERATED_FILES_TOKEN }}

      - name: Checkout repository
        if: >-
          github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Generate code, manifests, and formatting
        run: |
          make generate
          make manifests
          make fmt

      - name: Commit generated files or enforce fork consistency
        id: generated
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Generated files are current."
            exit 0
          fi

          echo "Generation produced changes:"
          git status --short
          git diff -- .

          if [[ "${EVENT_NAME}" != "pull_request" ]]; then
            echo "Generated files are stale on ${EVENT_NAME}; refusing to modify this ref." >&2
            exit 1
          fi

          if [[ "${HEAD_REPOSITORY}" != "${REPOSITORY}" ]]; then
            echo "This pull request comes from a fork, so CI cannot push generated files safely." >&2
            echo "Run 'make generate manifests', then 'make fmt', and commit the results." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --message "chore: update generated manifests"
          git push origin "HEAD:${HEAD_REF}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - generated-files

    if: needs.generated-files.outputs.changed != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Verify Go modules
        run: go mod verify

      - name: Generate code and manifests
        run: make generate manifests

      - name: Format code
        run: make fmt

      - name: Run tests
        run: make test

      - name: Check generated and formatted files
        shell: bash
        run: |
          set -euo pipefail

          changes="$(git status --porcelain)"

          if [[ -n "${changes}" ]]; then
            echo "Generated or formatted files are not up to date."
            echo
            echo "Changed files:"
            printf '%s\n' "${changes}"
            echo
            echo "Diff:"
            git diff -- .
            echo
            echo "Run locally:"
            echo
            echo "  make generate manifests"
            echo "  make fmt"
            echo
            echo "Then commit the generated changes."
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    needs:
      - generated-files

    if: needs.generated-files.outputs.changed != 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4
          args: --timeout=5m

  release-snapshot:
    name: Validate Helm and release
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - test
      - lint

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Generate code and manifests
        run: make generate manifests

      - name: Format code
        run: make fmt

      - name: Verify generated files are committed
        shell: bash
        run: |
          set -euo pipefail

          changes="$(git status --porcelain)"

          if [[ -n "${changes}" ]]; then
            echo "The snapshot release produced uncommitted generated changes."
            echo
            printf '%s\n' "${changes}"
            echo
            git diff -- .
            echo
            echo "Run and commit:"
            echo
            echo "  make generate manifests"
            echo "  make fmt"
            exit 1
          fi

      - name: Validate and package Helm chart
        shell: bash
        run: |
          set -euo pipefail

          ./hack/package-release-helm-chart.sh \
            0.0.0-snapshot \
            v0.0.0-snapshot

      - name: Verify packaged Helm chart
        shell: bash
        run: |
          set -euo pipefail

          chart="dist/helm/external-service-discovery-operator-0.0.0-snapshot.tgz"
          rendered="$(mktemp)"

          test -f "${chart}"
          tar -tzf "${chart}"

          helm template \
            external-service-discovery-operator \
            "${chart}" \
            --namespace external-service-discovery-operator-system \
            > "${rendered}"

          go run ./hack/verify-rbac "${rendered}"

      - name: Validate GoReleaser configuration
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Publish release

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    needs:
      - test
      - lint
      - release-snapshot

    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write

    uses: ./.github/workflows/release.yaml
    secrets: inherit
