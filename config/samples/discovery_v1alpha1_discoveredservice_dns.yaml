apiVersion: discovery.k8sready.com/v1alpha1
kind: DiscoveredService
metadata:
  name: tomcat-dns
  namespace: default
spec:
  discovery:
    dns:
      names:
      - tomcat-01.internal.example.com
      - tomcat-02.internal.example.com
      - tomcat-03.internal.example.com
  ports:
  - name: http
    port: 8080
    protocol: TCP
  healthCheck:
    type: HTTP
    port: 8080
    path: /healthz
    interval: 10s
    timeout: 3s
    successThreshold: 1
    failureThreshold: 3
